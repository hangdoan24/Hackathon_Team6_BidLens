<!-- BEGIN: PageTransition -->
<div id="page-transition" aria-hidden="true"></div>
<style>
  #page-transition{
    position:fixed; inset:0; z-index:100; pointer-events:none;
    background:#000; opacity:0; transition:opacity .35s ease;
  }
  #page-transition.is-active{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    #page-transition{ transition:none; }
  }
</style>
<script>
  (function () {
    var cta = document.getElementById('cta-launch');
    var veil = document.getElementById('page-transition');
    if (!cta || !veil) return;

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    cta.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // let new-tab clicks through
      if (reduced) return;
      e.preventDefault();
      veil.classList.add('is-active');
      setTimeout(function () { window.location.href = cta.getAttribute('href'); }, 320);
    });

    // Enter / Space on the focused CTA follows the same path as a click.
    cta.addEventListener('keydown', function (e) {
      if (e.key === ' ') { e.preventDefault(); cta.click(); }
    });
  })();
</script>
<!-- END: PageTransition -->
